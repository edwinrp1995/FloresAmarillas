<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Regalo Especial 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1b2a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        /* --- PANTALLA 1: CAJA DE REGALO --- */
        #gift-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 999;
            background-color: #0d1b2a;
        }

        .gift-instruction {
            font-size: 1.4rem;
            color: #fbd512;
            margin-bottom: 40px;
            text-align: center;
            padding: 0 20px;
            text-shadow: 0 0 10px rgba(251, 213, 18, 0.4);
            animation: pulse 1.5s infinite ease-in-out;
        }

        .gift-btn-trigger {
            background: transparent;
            border: none;
            outline: none;
            padding: 40px;
            cursor: pointer;
            display: block;
            -webkit-tap-highlight-color: transparent;
        }

        .box {
            position: relative;
            width: 120px;
            height: 120px;
            background: #e74c3c;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: wobble 2s infinite ease-in-out;
        }

        .box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 100%;
            background: #f1c40f;
        }

        .box::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 100%;
            height: 25px;
            background: #f1c40f;
        }

        .box-lid {
            position: absolute;
            top: -15px;
            left: -5px;
            width: 130px;
            height: 25px;
            background: #c0392b;
            border-radius: 5px;
            box-shadow: 0 4px 5px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .box-lid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 100%;
            background: #f1c40f;
        }

        /* --- PANTALLA 2: CONTENIDO PRINCIPAL (FLOR) --- */
        #main-content {
            display: none;
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            color: #fbd512;
            text-shadow: 0 0 15px rgba(251, 213, 18, 0.6);
            margin-bottom: 10px;
        }

        .flower {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 40px auto 0 auto;
            animation: float 4s ease-in-out infinite;
        }

        .center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #8b5a2b, #4a2c0f);
            border-radius: 50%;
            z-index: 5;
        }

        .petal {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 75px;
            background: linear-gradient(to bottom, #fff700, #f1c40f);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            transform-origin: bottom center;
        }

        .petal-1  { transform: translate(-50%, -100%) rotate(0deg); }
        .petal-2  { transform: translate(-50%, -100%) rotate(30deg); }
        .petal-3  { transform: translate(-50%, -100%) rotate(60deg); }
        .petal-4  { transform: translate(-50%, -100%) rotate(90deg); }
        .petal-5  { transform: translate(-50%, -100%) rotate(120deg); }
        .petal-6  { transform: translate(-50%, -100%) rotate(150deg); }
        .petal-7  { transform: translate(-50%, -100%) rotate(180deg); }
        .petal-8  { transform: translate(-50%, -100%) rotate(210deg); }
        .petal-9  { transform: translate(-50%, -100%) rotate(240deg); }
        .petal-10 { transform: translate(-50%, -100%) rotate(270deg); }
        .petal-11 { transform: translate(-50%, -100%) rotate(300deg); }
        .petal-12 { transform: translate(-50%, -100%) rotate(330deg); }

        .stem {
            width: 6px;
            height: 120px;
            background: linear-gradient(to bottom, #2e7d32, #1b5e20);
            margin: -15px auto 30px auto;
            border-radius: 4px;
            position: relative;
            z-index: 1;
        }

        .leaf {
            position: absolute;
            width: 30px;
            height: 20px;
            background: #2e7d32;
            border-radius: 0 100px 0 100px;
        }

        .leaf-left { top: 30px; left: -25px; transform: rotate(-15deg); }
        .leaf-right { top: 60px; right: -25px; transform: rotate(195deg); }

        .btn {
            background-color: #fbd512;
            color: #0d1b2a;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(251, 213, 18, 0.4);
            -webkit-tap-highlight-color: transparent;
        }

        /* --- PANTALLA 3: CARTA OCULTA --- */
        .letter-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 340px;
            background: #fff;
            color: #333;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
            text-align: center;
        }

        .letter-modal h2 {
            color: #d4ac0d;
            margin-bottom: 15px;
            font-size: 1.6rem;
        }

        .letter-modal p {
            font-size: 1rem;
            line-height: 1.5;
            color: #555;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ANIMACIONES CSS --- */
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg); }
            15% { transform: rotate(-5deg); }
            30% { transform: rotate(4deg); }
            45% { transform: rotate(-3deg); }
            60% { transform: rotate(2deg); }
            75% { transform: rotate(-1deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
    </style>
</head>
<body>

    <!-- PANTALLA 1: CAJA DE REGALO -->
    <div id="gift-screen">
        <div class="gift-instruction">Tienes un regalo pendiente... ¡Presiónalo! 💛</div>
        <!-- Evento onclick directo e infalible -->
        <button class="gift-btn-trigger" onclick="abrirRegalo()">
            <div class="box">
                <div class="box-lid"></div>
            </div>
        </button>
    </div>

    <!-- PANTALLA 2: CONTENIDO PRINCIPAL -->
    <div id="main-content">
        <h1>¡Feliz Día! 💛</h1>
        
        <div class="flower">
            <div class="center"></div>
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="petal petal-5"></div>
            <div class="petal petal-6"></div>
            <div class="petal petal-7"></div>
            <div class="petal petal-8"></div>
            <div class="petal petal-9"></div>
            <div class="petal petal-10"></div>
            <div class="petal petal-11"></div>
            <div class="petal petal-12"></div>
        </div>
        <div class="stem">
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
        </div>

        <button class="btn" onclick="mostrarCarta(true)">Leer mensajito</button>
    </div>

    <!-- PANTALLA 3: CARTA OCULTA -->
    <div id="letter" class="letter-modal">
        <h2>Para Alguien Especial ✨</h2>
        <p>Hoy es el día de las flores amarillas y no quería dejar pasar la oportunidad de recordarte lo importante que eres. Que esta flor virtual te alegre el día y te saque una gran sonrisa. ¡Te quiero muchísimo! 💛</p>
        <button class="close-btn" onclick="mostrarCarta(false)">Cerrar</button>
    </div>

    <script>
        // Funciones directas sin dependencias externas
        function abrirRegalo() {
            // Desaparece por completo la pantalla de la caja
            document.getElementById('gift-screen').style.display = 'none';
