<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de las Flores Amarillas 💛</title>
    <!-- Enlace al archivo de estilos externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PANTALLA 1: CAJA DE REGALO -->
    <div id="gift-screen">
        <div class="gift-instruction">Tienes un regalo pendiente... ¡Presiónalo! 💛</div>
        <button class="gift-btn-trigger" id="btn-open">
            <div class="box">
                <div class="box-lid"></div>
            </div>
        </button>
    </div>

    <!-- PANTALLA 2: CONTENIDO PRINCIPAL -->
    <div id="main-content">
        <h1>¡Feliz Día! 💛</h1>
        
        <div class="flower">
            <div class="center"></div>
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="petal petal-5"></div>
            <div class="petal petal-6"></div>
            <div class="petal petal-7"></div>
            <div class="petal petal-8"></div>
            <div class="petal petal-9"></div>
            <div class="petal petal-10"></div>
            <div class="petal petal-11"></div>
            <div class="petal petal-12"></div>
        </div>
        <div class="stem">
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
        </div>

        <button class="btn" id="btn-show-letter">Leer mensajito</button>
    </div>

    <!-- PANTALLA 3: CARTA OCULTA -->
    <div id="letter" class="letter-modal">
        <h2>Para Alguien Especial ✨</h2>
        <p>Hoy es el día de las flores amarillas y no quería dejar pasar la oportunidad de recordarte lo importante que eres. Que esta flor virtual te alegre el día y te saque una gran sonrisa. ¡Te quiero muchísimo! 💛</p>
        <button class="close-btn" id="btn-close-letter">Cerrar</button>
    </div>

    <!-- Enlace al archivo de JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
